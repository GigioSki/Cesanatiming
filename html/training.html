<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allenamento - Cesana Timing</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">Cesana Timing</div>
    <div class="navbar-right">
      <a href="/timing.html" class="nav-link">Tempi</a>
      <a href="/setup.html" class="nav-link">Setup</a>
      <a href="/admin" class="nav-link">Admin</a>
      <button id="theme-toggle" class="theme-toggle">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="event-header" id="event-header">
      <h1>Allenamento</h1>
      <p id="event-info">Caricamento…</p>
    </section>

    <table>
      <thead>
        <tr>
          <th>Nome/Tag</th>
          <th>Tempo</th>
          <th class="start-time-col">Ora partenza</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="3">Caricamento…</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.body.classList.toggle('dark-mode', currentTheme==='dark');
    toggle.textContent = currentTheme==='dark'?'☀️':'🌙';
    toggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark?'dark':'light');
      toggle.textContent = isDark?'☀️':'🌙';
    });

    function hexToRGBA(hex, alpha) {
      const h = hex.replace('#', '');
      const bigint = parseInt(h, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getSlug() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 2) return null;
      return `${parts[0]}/${parts[1]}`;
    }

    async function loadEvent() {
      const slug = getSlug();
      if (!slug) return;
      try {
        const res = await fetch(`/api/events/lookup?slug=${encodeURIComponent(slug)}`);
        if (!res.ok) {
          document.getElementById('event-info').textContent = 'Evento non trovato';
          return;
        }
        const event = await res.json();
        document.getElementById('event-info').innerHTML = `
          <strong>${event.name || 'Allenamento'}</strong> · Codice ${event.slug.split('/')[1]} · Stato ${event.status}
        `;
      } catch (err) {
        console.error(err);
      }
    }

    async function loadTimings() {
      const slug = getSlug();
      if (!slug) return;
      const res = await fetch(`/api/timings?eventSlug=${encodeURIComponent(slug)}`);
      const data = await res.json();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="3">Nessun tempo registrato.</td></tr>';
        return;
      }
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.best ? '☆ ' : ''}${r.name}</td>
          <td>${r.elapsed}</td>
          <td class="start-time-col">${r.start_time}</td>
        `;
        if (r.color) {
          tr.style.backgroundColor = hexToRGBA(r.color, 0.2);
        }
        tbody.appendChild(tr);
      });
    }

    loadEvent();
    loadTimings();
    setInterval(loadTimings, 2000);
  </script>
</body>
</html>
