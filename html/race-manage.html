<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestione Gara - Cesana Timing</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">Cesana Timing</div>
    <div class="navbar-right">
      <a href="/timing.html" class="nav-link">Tempi</a>
      <a href="/setup.html" class="nav-link">Setup</a>
      <a href="/admin" class="nav-link">Admin</a>
      <button id="theme-toggle" class="theme-toggle">🌙</button>
    </div>
  </header>

  <main class="container race-manage">
    <section class="race-section">
      <h1 id="race-title">Gestione Gara</h1>
      <p id="race-info">Caricamento…</p>
      <div class="next-start">
        <h2>Prossima partenza</h2>
        <div id="next-start-value" class="next-start-value">—</div>
      </div>
    </section>

    <section class="race-section">
      <h2>Opzioni di gara</h2>
      <div class="race-options">
        <div>
          <h3>Modalità partenza</h3>
          <label><input type="radio" name="start-mode" value="bracelet"> Braccialetti</label>
          <label><input type="radio" name="start-mode" value="bib"> Pettorali</label>
        </div>
        <div>
          <h3>Ordine</h3>
          <label><input type="radio" name="start-order" value="normal"> Normale</label>
          <label><input type="radio" name="start-order" value="reverse"> Invertito</label>
        </div>
        <div class="override-box">
          <h3>Sovrascrivi partenza</h3>
          <input type="number" id="override-input" placeholder="Numero pettorale">
          <button id="override-btn">Imposta</button>
          <button id="clear-override">Annulla</button>
        </div>
        <div class="pointer-box">
          <h3>Puntatore</h3>
          <p id="pointer-info">—</p>
          <button id="reset-pointer">Reset ordine</button>
        </div>
      </div>
    </section>

    <section class="race-section">
      <div class="participants-header">
        <h2>Partecipanti</h2>
        <div class="participants-actions">
          <label>Totale
            <input type="number" id="participants-total" min="0" value="0">
          </label>
          <button id="reset-participants">Rigenera elenco</button>
          <button id="export-participants">Esporta CSV</button>
          <button id="export-timings">Esporta tempi</button>
          <label class="import-button">
            Importa partecipanti
            <input type="file" id="import-participants" accept=".csv,text/csv">
          </label>
          <label class="import-button">
            Importa tempi
            <input type="file" id="import-timings" accept=".csv,text/csv">
          </label>
        </div>
      </div>
      <table class="participants-table">
        <thead>
          <tr>
            <th>Pettorale</th>
            <th>Nome</th>
            <th>Tag</th>
          </tr>
        </thead>
        <tbody id="participants-body">
          <tr><td colspan="3">Caricamento…</td></tr>
        </tbody>
      </table>
    </section>

    <section class="race-section">
      <div class="heats-header">
        <h2>Manche</h2>
        <button id="add-heat">Aggiungi manche</button>
      </div>
      <div id="heats-list" class="heats-list"></div>
    </section>
  </main>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.body.classList.toggle('dark-mode', currentTheme==='dark');
    toggle.textContent = currentTheme==='dark'?'☀️':'🌙';
    toggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark?'dark':'light');
      toggle.textContent = isDark?'☀️':'🌙';
    });

    const state = {
      event: null,
      participants: [],
      heats: []
    };

    function getSlug() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 2) return null;
      return `${parts[0]}/${parts[1]}`;
    }

    function sortParticipants(startOrder) {
      const apripista = state.participants.find(p => p.bib_number === 0);
      const others = state.participants
        .filter(p => p.bib_number != null && p.bib_number !== 0)
        .sort((a, b) => (a.bib_number || 0) - (b.bib_number || 0));
      if (startOrder === 'reverse') {
        others.reverse();
      }
      const queue = [];
      if (apripista) queue.push(apripista);
      queue.push(...others);
      return queue;
    }

    function parseMetadata(meta) {
      if (!meta) return {};
      try { return JSON.parse(meta); } catch { return {}; }
    }

    function computeNextStart() {
      if (!state.event) return '—';
      const metadata = parseMetadata(state.event.metadata);
      if (metadata.overrideBib != null) {
        return metadata.overrideBib;
      }
      const queue = sortParticipants(state.event.start_order || 'normal');
      if (!queue.length) return '—';
      const pointer = state.event.next_pointer || 0;
      if (pointer >= queue.length) return queue[queue.length - 1].bib_number ?? '—';
      return queue[pointer].bib_number ?? '—';
    }

    function renderInfo() {
      if (!state.event) return;
      document.getElementById('race-title').textContent = `${state.event.name || 'Gara'} (${state.event.slug})`;
      document.getElementById('race-info').innerHTML = `
        Stato: <strong>${state.event.status}</strong> · Tempi: <strong>${state.event.timings_count}</strong> · Partecipanti: <strong>${state.event.participants_count}</strong>
      `;
      const nextStart = computeNextStart();
      document.getElementById('next-start-value').textContent = nextStart;
      document.getElementById('pointer-info').textContent = `Indice: ${state.event.next_pointer || 0}`;
      document.querySelectorAll('input[name="start-mode"]').forEach(el => {
        el.checked = el.value === (state.event.start_mode || 'bracelet');
      });
      document.querySelectorAll('input[name="start-order"]').forEach(el => {
        el.checked = el.value === (state.event.start_order || 'normal');
      });
      document.getElementById('participants-total').value = state.participants.filter(p => p.bib_number != null && p.bib_number !== 0).length;
    }

    function renderParticipants() {
      const tbody = document.getElementById('participants-body');
      tbody.innerHTML = '';
      if (!state.participants.length) {
        tbody.innerHTML = '<tr><td colspan="3">Nessun partecipante</td></tr>';
        return;
      }
      const ordered = [...state.participants].sort((a, b) => (a.bib_number ?? 99999) - (b.bib_number ?? 99999));
      ordered.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.bib_number != null ? p.bib_number : ''}</td>
          <td><input type="text" data-bib="${p.bib_number}" value="${p.name || ''}"></td>
          <td><input type="text" data-bib="${p.bib_number}" data-tag value="${p.tag_uuid || ''}"></td>
        `;
        tr.querySelectorAll('input').forEach(input => {
          input.addEventListener('change', () => {
            const bib = Number(input.getAttribute('data-bib'));
            const nameInput = tr.querySelector('input[type="text"][data-bib]');
            const tagInput = tr.querySelector('input[data-tag]');
            saveParticipant(bib, nameInput.value, tagInput.value);
          });
        });
        tbody.appendChild(tr);
      });
    }

    function renderHeats() {
      const container = document.getElementById('heats-list');
      container.innerHTML = '';
      if (!state.heats.length) {
        container.innerHTML = '<p>Nessuna manche</p>';
        return;
      }
      state.heats.forEach(heat => {
        const div = document.createElement('div');
        div.className = 'heat-card';
        div.innerHTML = `
          <span>${heat.name}</span>
          <div>
            <button data-heat="${heat.id}" class="set-heat">Attiva</button>
          </div>
        `;
        if (state.event.current_heat_id === heat.id) {
          div.classList.add('active');
        }
        container.appendChild(div);
      });
      container.querySelectorAll('.set-heat').forEach(btn => {
        btn.addEventListener('click', async () => {
          const heatId = Number(btn.getAttribute('data-heat'));
          await fetch(`/api/events/${state.event.id}/config`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ current_heat_id: heatId })
          });
          loadData();
        });
      });
    }

    async function loadData() {
      const slug = getSlug();
      if (!slug) return;
      try {
        const lookup = await fetch(`/api/events/lookup?slug=${encodeURIComponent(slug)}`);
        if (!lookup.ok) {
          document.getElementById('race-info').textContent = 'Evento non trovato';
          return;
        }
        const base = await lookup.json();
        const detailRes = await fetch(`/api/events/${base.id}`);
        const detail = await detailRes.json();
        state.event = { ...detail.event, slug: base.slug };
        state.participants = detail.participants;
        state.heats = detail.heats;
        renderInfo();
        renderParticipants();
        renderHeats();
      } catch (err) {
        console.error('Errore caricamento gara', err);
      }
    }

    async function saveParticipant(bib, name, tag) {
      if (!state.event) return;
      await fetch(`/api/events/${state.event.id}/participants`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bibNumber: bib, name, tagUuid: tag })
      });
      loadData();
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
      return lines.slice(1).map(line => {
        const values = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i += 1) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            values.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current);
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = values[idx] ? values[idx].trim() : '';
        });
        return row;
      });
    }

    async function importParticipantsFromFile(file) {
      const text = await file.text();
      const rows = parseCsv(text);
      const mapped = rows.map(row => {
        const bibRaw = row.bib_number || row.bib || row.pettorale;
        return {
          bibNumber: bibRaw === undefined || bibRaw === null || bibRaw === '' ? null : bibRaw,
          name: row.name || row.nome,
          tagUuid: row.tag_uuid || row.tag || row.uuid
        };
      });
      await fetch(`/api/events/${state.event.id}/import/participants`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participants: mapped })
      });
      loadData();
    }

    async function importTimingsFromFile(file) {
      const text = await file.text();
      const rows = parseCsv(text);
      const mapped = rows.map(row => {
        const bibRaw = row.bib_number || row.bib || row.pettorale;
        return {
          bibNumber: bibRaw === undefined || bibRaw === null || bibRaw === '' ? null : bibRaw,
          tagId: row.tag_id || row.tag || row.uuid,
          elapsed: row.elapsed_text || row.elapsed || row.time,
          elapsedMs: row.elapsed_ms,
          startTime: row.start_time
        };
      });
      await fetch(`/api/events/${state.event.id}/import/timings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timings: mapped })
      });
      loadData();
    }

    document.querySelectorAll('input[name="start-mode"]').forEach(input => {
      input.addEventListener('change', async () => {
        if (!state.event) return;
        await fetch(`/api/events/${state.event.id}/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_mode: input.value })
        });
        loadData();
      });
    });

    document.querySelectorAll('input[name="start-order"]').forEach(input => {
      input.addEventListener('change', async () => {
        if (!state.event) return;
        await fetch(`/api/events/${state.event.id}/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_order: input.value })
        });
        loadData();
      });
    });

    document.getElementById('reset-participants').addEventListener('click', async () => {
      if (!state.event) return;
      const total = Number(document.getElementById('participants-total').value || 0);
      await fetch(`/api/events/${state.event.id}/participants/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ total })
      });
      loadData();
    });

    document.getElementById('override-btn').addEventListener('click', async () => {
      if (!state.event) return;
      const value = document.getElementById('override-input').value;
      await fetch(`/api/events/${state.event.id}/override`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bibNumber: value })
      });
      loadData();
    });

    document.getElementById('clear-override').addEventListener('click', async () => {
      if (!state.event) return;
      await fetch(`/api/events/${state.event.id}/override`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bibNumber: null })
      });
      loadData();
    });

    document.getElementById('reset-pointer').addEventListener('click', async () => {
      if (!state.event) return;
      await fetch(`/api/events/${state.event.id}/pointer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pointer: 0 })
      });
      loadData();
    });

    document.getElementById('export-participants').addEventListener('click', () => {
      if (!state.event) return;
      window.open(`/api/events/${state.event.id}/export/participants`, '_blank');
    });

    document.getElementById('export-timings').addEventListener('click', () => {
      if (!state.event) return;
      window.open(`/api/events/${state.event.id}/export/timings`, '_blank');
    });

    document.getElementById('import-participants').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        await importParticipantsFromFile(file);
        e.target.value = '';
      }
    });

    document.getElementById('import-timings').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        await importTimingsFromFile(file);
        e.target.value = '';
      }
    });

    document.getElementById('add-heat').addEventListener('click', async () => {
      if (!state.event) return;
      const name = prompt('Nome manche (opzionale)');
      await fetch(`/api/events/${state.event.id}/heats`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      loadData();
    });

    setInterval(loadData, 5000);
    loadData();
  </script>
</body>
</html>
