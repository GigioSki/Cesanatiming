<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gara - Cesana Timing</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">Cesana Timing</div>
    <div class="navbar-right">
      <a href="/timing.html" class="nav-link">Tempi</a>
      <a href="/setup.html" class="nav-link">Setup</a>
      <a href="/admin" class="nav-link">Admin</a>
      <button id="theme-toggle" class="theme-toggle">🌙</button>
    </div>
  </header>

  <main class="container race-view">
    <section class="event-header">
      <h1 id="race-title">Gara</h1>
      <p id="race-info">Caricamento…</p>
    </section>
    <section id="heats-container"></section>
  </main>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.body.classList.toggle('dark-mode', currentTheme==='dark');
    toggle.textContent = currentTheme==='dark'?'☀️':'🌙';
    toggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark?'dark':'light');
      toggle.textContent = isDark?'☀️':'🌙';
    });

    const state = {
      event: null,
      timings: []
    };

    function getSlug() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 2) return null;
      return `${parts[0]}/${parts[1]}`;
    }

    function groupByHeat(rows) {
      const map = new Map();
      rows.forEach(row => {
        const key = row.heat_name || 'Generale';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(row);
      });
      return Array.from(map.entries());
    }

    async function loadEvent() {
      const slug = getSlug();
      if (!slug) return;
      const res = await fetch(`/api/events/lookup?slug=${encodeURIComponent(slug)}`);
      if (!res.ok) {
        document.getElementById('race-info').textContent = 'Evento non trovato';
        return;
      }
      const event = await res.json();
      state.event = event;
      document.getElementById('race-title').textContent = event.name || `Gara ${event.slug}`;
      document.getElementById('race-info').textContent = `Stato ${event.status}`;
    }

    function hexToRGBA(hex, alpha) {
      const h = hex.replace('#', '');
      const bigint = parseInt(h, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function renderTimings() {
      const container = document.getElementById('heats-container');
      container.innerHTML = '';
      if (!state.timings.length) {
        container.innerHTML = '<p>Nessun tempo disponibile.</p>';
        return;
      }
      const groups = groupByHeat(state.timings);
      groups.forEach(([heatName, rows]) => {
        const section = document.createElement('section');
        section.className = 'heat-section';
        section.innerHTML = `<h2>${heatName}</h2>`;
        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr><th>Nome/Tag</th><th>Tempo</th><th class="start-time-col">Ora partenza</th></tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${r.best ? '☆ ' : ''}${r.name}</td>
            <td>${r.elapsed}</td>
            <td class="start-time-col">${r.start_time}</td>
          `;
          if (r.color) {
            tr.style.backgroundColor = hexToRGBA(r.color, 0.2);
          }
          tbody.appendChild(tr);
        });
        section.appendChild(table);
        container.appendChild(section);
      });
    }

    async function loadTimings() {
      const slug = getSlug();
      if (!slug) return;
      const res = await fetch(`/api/timings?eventSlug=${encodeURIComponent(slug)}&limit=300`);
      if (!res.ok) return;
      state.timings = await res.json();
      renderTimings();
    }

    loadEvent();
    loadTimings();
    setInterval(loadTimings, 2000);
  </script>
</body>
</html>
